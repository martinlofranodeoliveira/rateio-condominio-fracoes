name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes (${{ matrix.os }} / Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Executar suíte unittest
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v
      - name: Executar verificador independente SQLite
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/verify_independent.py

  distribution:
    name: Empacotamento e Verificação Isolada de Rede
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ferramentas de build
        run: python -m pip install --upgrade pip -r requirements-build.txt
      - name: Construir wheel e sdist
        run: |
          python -c "import setuptools.build_meta as b; b.build_sdist('dist'); b.build_wheel('dist')"
      - name: Verificar distribuição e isolamento
        run: python scripts/check_distribution.py --dist dist
      - name: Executar verificador independente em namespace sem rede
        run: |
          if command -v unshare >/dev/null 2>&1 && unshare -r -n true 2>/dev/null; then
            unshare -r -n python tools/verify_independent.py
          else
            python tools/verify_independent.py
          fi
