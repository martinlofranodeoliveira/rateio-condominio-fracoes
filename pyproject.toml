[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rateio-condominio-fracoes"
version = "1.0.0"
description = "Rateio condominial determinístico por fração ideal milesimal, hidrômetros individualizados e conservação exata de centavos."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Martin Lofrano / LOFRANO TECNOLOGIA", email = "martinlofranodeoliveira@users.noreply.github.com" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Office/Business :: Financial :: Accounting",
]
keywords = [
    "condominio",
    "rateio",
    "fracao-ideal",
    "hidrometro",
    "contabilidade",
    "centavos-exatos",
    "hare-niemeyer",
]

[project.urls]
Homepage = "https://github.com/martinlofranodeoliveira/rateio-condominio-fracoes"
Repository = "https://github.com/martinlofranodeoliveira/rateio-condominio-fracoes"
Issues = "https://github.com/martinlofranodeoliveira/rateio-condominio-fracoes/issues"

[project.scripts]
rateio-condominio-fracoes = "rateio_condominio_fracoes.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
